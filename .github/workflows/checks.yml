name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Native display, cursor, pacing and USB checks
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('Run-FramePacingTests.ps1', 'Run-DesktopCursorTests.ps1', 'Run-SignedDisplayOutputTests.ps1', 'Run-DisplayModesTests.ps1', 'Run-UsbProbeTests.ps1')) {
            powershell.exe -NoProfile -File ".\tests\$test"
            if ($LASTEXITCODE -ne 0) { throw "$test failed." }
          }
      - name: Display service IPC checks
        run: |
          $ErrorActionPreference = 'Stop'
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$installation\MSBuild\Current\Bin\MSBuild.exe" tests\DisplayService.Tests.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'Display service tests did not build.' }
          & .\.codex\display-service-tests\bin\DisplayService.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Display service tests failed.' }
      - name: Mocked setup transactions
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MaximumVersion 4.99 -ErrorAction Stop
          $result = Invoke-Pester -Script @('tests/Setup-Driver.Tests.ps1', 'tests/SignedSetup.Tests.ps1', 'tests/RegistrySetup.Tests.ps1') -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { throw 'Setup transaction checks failed.' }
      - name: EDID configuration checks
        run: python -m unittest discover -s tests -p test_ipad_edid_size.py -v

  ipad-helpers:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Production BSD transport checks
        run: python3 tests/run_ipad_transport_tests.py
      - name: Production logging and frame diagnostics checks
        run: python3 tests/run_ipad_performance_tests.py
